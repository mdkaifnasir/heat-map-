<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maharashtra MLA Heatmap 2024</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d12;
            --card-bg: rgba(25, 25, 35, 0.8);
            --accent-color: #a855f7;
            --text-color: #e2e8f0;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        #map {
            height: 100vh;
            width: 100vw;
            z-index: 1;
        }

        .overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 24px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            max-width: 320px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 22px;
            font-weight: 600;
            background: linear-gradient(to right, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            margin: 0;
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.5;
        }

        .stats {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            display: block;
            font-size: 20px;
            font-weight: 600;
            color: var(--accent-color);
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
        }

        .leaflet-popup-content-wrapper {
            background: var(--card-bg) !important;
            backdrop-filter: blur(12px) !important;
            color: var(--text-color) !important;
            border-radius: 12px !important;
            border: 1px solid var(--glass-border) !important;
            padding: 5px;
        }

        .leaflet-popup-tip {
            background: var(--card-bg) !important;
        }

        .custom-popup b {
            color: var(--accent-color);
            display: block;
            margin-bottom: 4px;
            font-size: 16px;
        }

        .custom-popup span {
            font-size: 13px;
            color: #cbd5e1;
        }

        .legend {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 1000;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
            font-size: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .gradient-bar {
            width: 100px;
            height: 10px;
            background: linear-gradient(to right, blue, cyan, lime, yellow, red);
            border-radius: 5px;
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <h1>Maharashtra MLA Heatmap</h1>
        <p>Visualizing the density and distribution of 288 constituencies across the state based on the 2024 Election data.</p>
        <div class="stats">
            <div class="stat-card">
                <span class="stat-value">288</span>
                <span class="stat-label">Constituencies</span>
            </div>
            <div class="stat-card">
                <span class="stat-value">36</span>
                <span class="stat-label">Districts</span>
            </div>
        </div>
    </div>

    <div class="legend">
        <div class="legend-item">
            <span>Low Density</span>
            <div class="gradient-bar"></div>
            <span>High Density</span>
        </div>
    </div>

    <div id="map"></div>
